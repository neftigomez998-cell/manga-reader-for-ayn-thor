plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thormanga.reader'
    compileSdk 34

    defaultConfig {
        applicationId 'com.thormanga.reader'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // Reads .cbr / .rar (RAR 4 and older)
    implementation 'com.github.junrar:junrar:7.5.5'
}
